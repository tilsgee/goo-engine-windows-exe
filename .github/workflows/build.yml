  build-windows:
    name: Build Goo Engine on Windows (MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Checkout Blender Addons Repository
        shell: bash # Using bash for git commands
        # Ensure this runs from the source code root directory
        # working-directory: ${{ github.workspace }} # Set if needed, often the default
        run: |
          ADDONS_REPO_URL="https://projects.blender.org/blender/blender-addons.git"
          # The target directory expected by CMake
          ADDONS_TARGET_DIR="scripts/addons"

          echo "Checking addons directory: $ADDONS_TARGET_DIR"
          if [ -d "$ADDONS_TARGET_DIR" ] ; then
            echo "Addons directory already exists. Skipping clone."
          else
            echo "Cloning addons from $ADDONS_REPO_URL into $ADDONS_TARGET_DIR"
            # Use --depth 1 for a faster shallow clone (no history)
            git clone --depth 1 "$ADDONS_REPO_URL" "$ADDONS_TARGET_DIR"
            if [ $? -ne 0 ]; then
              echo "::error::Failed to clone Blender addons."
              exit 1
            fi
            echo "Blender addons cloned successfully."
          fi

          # Optional: If Goo Engine also uses contrib addons, uncomment and adapt below
          # ADDONS_CONTRIB_REPO_URL="https://projects.blender.org/blender/blender-addons-contrib.git"
          # ADDONS_CONTRIB_TARGET_DIR="scripts/addons_contrib"
          # echo "Checking contrib addons directory: $ADDONS_CONTRIB_TARGET_DIR"
          # if [ -d "$ADDONS_CONTRIB_TARGET_DIR" ] ; then
          #   echo "Contrib addons directory already exists. Skipping clone."
          # else
          #   echo "Cloning contrib addons from $ADDONS_CONTRIB_REPO_URL into $ADDONS_CONTRIB_TARGET_DIR"
          #   git clone --depth 1 "$ADDONS_CONTRIB_REPO_URL" "$ADDONS_CONTRIB_TARGET_DIR"
          #   if [ $? -ne 0 ]; then
          #     echo "::warning::Failed to clone Blender contrib addons (optional)."
          #     # Decide if this failure should stop the build (exit 1) or just warn
          #   else
          #     echo "Blender contrib addons cloned successfully."
          #   fi
          # fi

      - name: Checkout Goo Engine Precompiled Libraries (for VC17)
        shell: pwsh
        # Ensure this runs from the source code root directory
        # working-directory: ${{ github.workspace }} # Set if needed, often the default
        run: |
          $libParentDir = "..\lib" # Relative to source root: one level up, then 'lib'
          $repoUrl = "https://projects.blender.org/blender/lib-windows_x64.git" # Official libs repo
          $targetLibSubDir = "win64_vc17" # Target directory name MUST match the corrected CMake logic
          $checkoutPath = Join-Path $libParentDir $targetLibSubDir

          Write-Host "Preparing library directory structure..."
          # Ensure the parent 'lib' directory exists relative to source parent
          $actualLibParentPath = Resolve-Path "..\lib" -ErrorAction SilentlyContinue
          if (-not $actualLibParentPath) {
            New-Item -ItemType Directory -Path "..\lib" | Out-Null
            Write-Host "Created directory: ..\lib"
          } else {
             Write-Host "Directory exists: ..\lib"
          }

          # Navigate up one level to perform the clone into the correct relative path
          Push-Location ..

          # Ensure clean state by removing target if it exists
          if (Test-Path $checkoutPath -PathType Container) {
            Write-Host "Removing existing library directory: $checkoutPath"
            Remove-Item -Recurse -Force $checkoutPath
          }

          Write-Host "Cloning libraries from '$repoUrl' directly into '$checkoutPath'"
          # Use git clone <url> <target_directory> feature
          git clone --depth 1 --progress $repoUrl $checkoutPath
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to clone libraries from '$repoUrl'."
            exit 1 # Fail the workflow step
          }

          Write-Host "Libraries checkout complete into '$checkoutPath'"

          Pop-Location # Return to the original source directory
      

      - name: Install Build & Packaging Dependencies (Windows)
        run: |
          choco upgrade chocolatey -y
          choco install cmake -y --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Download WiX Toolset Binaries from GitHub
        run: |
          New-Item -ItemType Directory -Force -Path "C:\wix"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile "C:\wix\wix311-binaries.zip"
          Expand-Archive -Path "C:\wix\wix311-binaries.zip" -DestinationPath "C:\wix"

      - name: Configure Build with CMake (Windows)
        run: |
          make.bat
          make update
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release `
                   -DWITH_COMPILER_PRECOMPILED_HEADERS=OFF `
                   -DWITH_FFTW3=ON `
                   -DWITH_OPENMP=ON `
                   -DWITH_VULKAN_BACKEND=ON

     # - name: Build Goo Engine (Windows)
     #   run: |
     #     cd build
     #     cmake --build . --config Release --target goo_engine -- /m

      - name: Build Goo Engine using make.bat (Windows)
        run: |
          make.bat

      - name: Package Goo Engine as MSI Using WiX Toolset
        working-directory: build
        run: >
          "C:\wix\bin\candle.exe" ../tools/installer.wxs -out installer.wixobj &&
          "C:\wix\bin\light.exe" installer.wixobj -out goo_engine.wix.msi

      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goo_engine-windows-msi
          path: build/goo_engine.wix.msi