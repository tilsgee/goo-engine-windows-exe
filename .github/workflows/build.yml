name: Build and Upload Goo Engine (AppImage & MSI)

on:
  push:
    branches:
      - tilsgee-main
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Goo Engine on Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Run the custom script to install missing dependencies.
          bash tools/install_missing_deps.sh

      - name: Build and Install Shaderc
        run: |
            git clone https://github.com/google/shaderc.git
            cd shaderc
            mkdir build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release -DSHADERC_SKIP_TESTS=ON -DSPIRV-TOOLS_ROOT=/usr
            make -j$(nproc)
            sudo make install

      - name: Download appimagetool
        run: |
          wget -O appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Configure Build with CMake (Linux)
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DWITH_COMPILER_PRECOMPILED_HEADERS=OFF \
                   -DWITH_FFTW3=ON \
                   -DWITH_OPENMP=ON \
                   -DWITH_VULKAN_BACKEND=ON

      - name: Build Goo Engine (Linux)
        run: |
          cd build
          cmake --build . -- -j$(nproc)

      - name: Prepare AppDir for AppImage Packaging
        run: |
          cd build
          mkdir -p AppDir/usr/bin
          cp goo_engine AppDir/usr/bin/
          cp ../tools/AppRun AppDir/
          cp ../tools/goo_engine.desktop AppDir/
          cp ../tools/goo_engine.png AppDir/
          chmod +x AppDir/AppRun

      - name: Package Goo Engine as AppImage
        run: |


  build-windows:
    name: Build Goo Engine on Windows (MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Download Precompiled Libraries
        run: |
          # Ensure the parent "lib" folder exists.
          New-Item -ItemType Directory -Force -Path "..\lib" | Out-Null
          # Download the ZIP file containing precompiled libs.
          Invoke-WebRequest -Uri "https://your-file-host.com/path/to/lib_win64_vc15.zip" -OutFile "..\lib\win64_vc15.zip"
          # Extract the ZIP to the required folder.
          Expand-Archive -Path "..\lib\win64_vc15.zip" -DestinationPath "..\lib\win64_vc15"

      - name: Install Build & Packaging Dependencies (Windows)
        run: |
          choco upgrade chocolatey -y
          choco install cmake -y --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Download WiX Toolset Binaries from GitHub
        run: |
          New-Item -ItemType Directory -Force -Path "C:\wix"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile "C:\wix\wix311-binaries.zip"
          Expand-Archive -Path "C:\wix\wix311-binaries.zip" -DestinationPath "C:\wix"

      - name: Configure Build with CMake (Windows)
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release `
                   -DWITH_COMPILER_PRECOMPILED_HEADERS=OFF `
                   -DWITH_FFTW3=ON `
                   -DWITH_OPENMP=ON `
                   -DWITH_VULKAN_BACKEND=ON

      - name: Build Goo Engine (Windows)
        run: |
          cd build
          cmake --build . --config Release -- /m

      - name: Package Goo Engine as MSI Using WiX Toolset
        working-directory: build
        run: >
          "C:\wix\bin\candle.exe" ../tools/installer.wxs -out installer.wixobj &&
          "C:\wix\bin\light.exe" installer.wixobj -out goo_engine.wix.msi

      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: goo_engine-windows-msi
          path: build/goo_engine.wix.msi