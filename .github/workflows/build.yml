name: Build and Upload Goo Engine (AppImage & MSI)

on:
  push:
    branches:
      - tilsgee-main
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Goo Engine on Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Add LunarG Vulkan repository. Just for the sake of it.
        run: |
          # Add the LunarG Vulkan repository for Ubuntu 22.04 (Jammy Jellyfish)
          # and Ubuntu 24.04 (Noble Numbat) - might be the future for ubuntu-latest
          sudo apt-get install -y wget gnupg2
          # Add the signing key
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo gpg --dearmor -o /usr/share/keyrings/lunarg.gpg
          # Add the repository to sources.list.d
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/lunarg.gpg] https://packages.lunarg.com/vulkan/ubuntu/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/lunarg-vulkan.list
          # Update package list
          sudo apt-get update
       # run: |
          #wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          # For Ubuntu 22.04 (Jammy Jellyfish) - likely for ubuntu-latest until a transition
          #sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          # For Ubuntu 24.04 (Noble Numbat) - might be the future for ubuntu-latest
          # sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list http://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          #sudo apt update
        
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Run the custom script to install missing dependencies.
          bash tools/install_missing_deps.sh

          //I don't need below script, due to already installed shaderc on previous command
